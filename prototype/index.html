<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Land of Machala · prototyp</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- DEV - skrytá mimo file:/localhost, nebo ?dev=0; ?dev=1 / Ctrl+Shift+D ji ukáže -->
  <header class="proto-bar is-collapsed" data-dev-only hidden aria-label="Vývojářský storybook">
    <div class="dev-row">
      <div class="dev-knob dev-main">
        <button type="button" class="dev-toggle" id="dev-detail" aria-expanded="false" aria-controls="dev-detail-panel" title="Knoby a přepínače"><i class="chev" aria-hidden="true"></i>Scéna</button>
        <select id="dev-scenario" aria-label="Scéna (nastaví vše)"></select>
      </div>
      <button type="button" class="dev-btn" id="dev-reset" title="Postaví scénu znovu, stejný seed">↺ Reset</button>
    </div>
    <div id="dev-detail-panel" class="dev-detail" hidden>
      <p class="dev-group">Nastavení scény</p>
      <details class="dev-sec" data-sec="postava"><summary>Postava</summary><div class="dev-row dev-knobs" data-knob-sec="postava"></div></details>
      <details class="dev-sec" data-sec="svet"><summary>Svět</summary><div class="dev-row dev-knobs" data-knob-sec="svet"></div></details>
      <details class="dev-sec" data-sec="boj"><summary>Boj</summary><div class="dev-row dev-knobs" data-knob-sec="boj"></div></details>
      <p class="dev-group">Vývojářské</p>
      <details class="dev-sec" data-sec="ladeni"><summary>Odhalení</summary><div class="dev-row dev-toggles" id="dev-toggles" role="group" aria-label="Odhalení pravdy (dev režim)"></div></details>
      <p class="dev-group">Přehledy</p>
      <details class="dev-sec" data-sec="stav"><summary>Stav systémů</summary><div id="dev-status" class="dev-status"></div></details>
    </div>
    <p id="dev-note" class="dev-note hidden"></p>
  </header>

  <!-- LANDING - brand, tagline, citát z města, auth -->
  <main data-screen="landing" class="view-full landing-screen">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="landing-frame landing-auth-only">
      <p class="brand">Land of Machala</p>
      <p class="landing-tagline">Textová poutnická RPG v zemi Machala.</p>
      <figure class="landing-quote">
        <blockquote id="landing-quote"></blockquote>
        <figcaption id="landing-quote-by"></figcaption>
      </figure>
      <section class="auth-card">
        <div id="auth-chrome"></div>
        <div id="auth-continue" class="auth-continue hidden"></div>
        <div id="auth-register">
          <label>E-mail<input type="email" placeholder="poutnik@machala.cz" autocomplete="username" /></label>
          <label>Tajná fráze<input type="password" placeholder="••••••••" autocomplete="new-password" /></label>
          <div class="auth-consent-slot">
            <label class="check"><input type="checkbox" /> Souhlasím s <button type="button" class="linkish" data-act="open-legal" data-legal="terms">podmínkami</button></label>
          </div>
          <button type="button" class="btn btn-primary wide" data-goto="origins">Vytvořit účet</button>
          <div class="auth-alt">
            <button type="button" class="btn btn-ghost wide auth-alt-btn" data-act="auth-signin">Už mám účet</button>
            <button type="button" class="btn btn-ghost wide auth-alt-btn" data-act="auth-guest">Hrát jako host</button>
          </div>
        </div>
        <div id="auth-signin" class="hidden">
          <label>E-mail<input type="email" placeholder="poutnik@machala.cz" autocomplete="username" /></label>
          <label>Tajná fráze<input type="password" placeholder="••••••••" autocomplete="current-password" /></label>
          <div class="auth-consent-slot" aria-hidden="true"></div>
          <button type="button" class="btn btn-primary wide" data-goto="town">Vstoupit do hry</button>
          <div class="auth-alt">
            <button type="button" class="btn btn-ghost wide auth-alt-btn" data-act="auth-register">Nemám účet</button>
            <button type="button" class="btn btn-ghost wide auth-alt-btn" data-act="auth-guest">Hrát jako host</button>
          </div>
        </div>
      </section>
      <footer class="landing-footer">
        <p id="landing-version">Verze …</p>
        <nav class="legal-links" aria-label="Odkazy">
          <button type="button" class="legal-link" data-act="open-settings">Nastavení</button>
          <span aria-hidden="true">·</span>
          <button type="button" class="legal-link" data-act="open-legal" data-legal="faq">FAQ</button>
          <span aria-hidden="true">·</span>
          <button type="button" class="legal-link" data-act="open-legal" data-legal="terms">Podmínky</button>
        </nav>
      </footer>
    </div>
  </main>

  <!-- PROLOG -->
  <main data-screen="origins" class="view-full landing-screen hidden">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="landing-frame narrow prolog-frame">
      <section class="auth-card grow-card">
        <div id="origins-box"></div>
      </section>
    </div>
  </main>

  <!-- POSTAVA (rasa, povolání, původ) -->
  <main data-screen="confirm" class="view-full landing-screen hidden">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="landing-frame narrow origin-frame">
      <section class="auth-card grow-card" id="screen-confirm-box">
        <div id="origin-chrome"></div>
        <div class="origin-layout">
          <div class="origin-name">
            <fieldset class="gender-row" id="gender-row">
              <legend class="gender-legend">Kdo jsi</legend>
              <label class="gender-pick"><input type="radio" name="gender" value="m" data-act="pick-gender" checked /><span>Chlap</span></label>
              <label class="gender-pick"><input type="radio" name="gender" value="f" data-act="pick-gender" /><span>Ženská</span></label>
            </fieldset>
            <label>Jak tě zovou
              <span class="name-row">
                <input id="input-name" type="text" maxlength="20" placeholder="Jedno slovo…" autocomplete="off" spellcheck="false" />
                <button type="button" class="dice-btn has-tip" data-act="dice-name" data-tip="Náhodné jméno podle pohlaví" aria-label="Náhodné jméno" title="Náhodné jméno">🎲</button>
              </span>
            </label>
          </div>
          <div class="origin-scroll">
          <div class="origin-cols">
          <details class="origin-acc origin-col" id="origin-race">
            <summary class="col-label">Vyber svůj kraj</summary>
            <div class="origin-acc-body">
              <div class="pick-grid" id="race-grid"></div>
              <p class="blurb-box" id="race-blurb"></p>
              <p class="bonus-label">Bonusy kraje</p>
              <div id="race-bonus"></div>
            </div>
          </details>
          <details class="origin-acc origin-col" id="origin-class">
            <summary class="col-label">Vyber svou živnost</summary>
            <div class="origin-acc-body">
              <div class="pick-grid" id="class-grid"></div>
              <p class="blurb-box" id="class-blurb"></p>
              <p class="bonus-label">Bonusy živnosti</p>
              <div id="class-bonus"></div>
            </div>
          </details>
          <details class="origin-acc origin-col" id="origin-origin">
            <summary class="col-label">Vyber svůj původ</summary>
            <div class="origin-acc-body">
              <div class="pick-grid" id="origin-grid"></div>
              <p class="blurb-box" id="origin-blurb"></p>
              <p class="bonus-label">Efekty původu</p>
              <div id="origin-effects" class="blurb-box"></div>
            </div>
          </details>
          </div>
          <aside class="stats-preview">
            <h3 class="col-label">Tvé statistiky</h3>
            <div class="stat-icons" id="confirm-stats"></div>
          </aside>
          </div>
        </div>
        <div class="actions origin-cta">
          <button type="button" class="btn btn-ghost" id="prolog-again" data-act="prolog-again" hidden>Projít prolog znovu</button>
          <button type="button" class="btn btn-primary" data-act="start-game">Vstoupit do hry</button>
          <p class="tip origin-cta-note" id="origin-cta-note"></p>
        </div>
      </section>
    </div>
  </main>

  <!-- MĚSTO -->
  <main data-screen="town" class="view-full game-screen hidden">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="game-frame">
      <div class="status-row compact">
        <article class="status-box" id="town-player"></article>
        <article class="status-box muted" id="town-context"></article>
      </div>
      <div class="mid-stage">
        <section class="log" id="town-log" data-log></section>
      </div>
      <div class="dock-stack">
        <section class="actions-dock dock-city" id="town-actions" aria-label="Město"></section>
      </div>
    </div>
    <footer class="player-footer" id="player-actions" aria-label="Rychlé volby"></footer>
  </main>

  <!-- BOJ -->
  <main data-screen="combat" class="view-full game-screen hidden">
    <div class="landing-bg" aria-hidden="true"></div>
    <div class="game-frame">
      <div class="status-row compact">
        <article class="status-box" id="combat-player"></article>
        <article class="status-box" id="combat-enemy"></article>
      </div>
      <div class="mid-stage">
        <div class="enemy-stage" id="enemy-stage" aria-hidden="true">
          <img src="../resources/enemies/placeholder/wolf.svg" alt="" width="380" height="380" />
        </div>
        <section class="log combat-log" id="combat-log" data-log></section>
      </div>
      <div class="dock-stack">
        <section class="actions-dock dock-combat" id="combat-actions" aria-label="Boj"></section>
      </div>
    </div>
    <footer class="player-footer" id="combat-player-actions" aria-label="Rychlé volby">
      <button type="button" class="dock-ico" data-act="open-char" title="Postava, klávesa 1" aria-label="Postava"><span aria-hidden="true">👤</span><em>Postava</em><kbd>1</kbd></button>
      <button type="button" class="dock-ico" data-act="open-inv" title="Inventář, klávesa 2" aria-label="Inventář"><span aria-hidden="true">🎒</span><em>Inventář</em><kbd>2</kbd></button>
      <button type="button" class="dock-ico" data-act="open-quests" title="Úkoly, klávesa 3" aria-label="Úkoly"><span aria-hidden="true">📜</span><em>Úkoly</em><kbd>3</kbd></button>
      <button type="button" class="dock-ico" data-act="open-map" title="Mapa, klávesa 4" aria-label="Mapa"><span aria-hidden="true">🗺</span><em>Mapa</em><kbd>4</kbd></button>
      <button type="button" class="dock-ico" data-act="open-settings" title="Nastavení, klávesa 5" aria-label="Nastavení"><span aria-hidden="true">⚙</span><em>Nastavení</em><kbd>5</kbd></button>
    </footer>
  </main>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <aside id="panel" class="panel-overlay hidden">
    <div class="panel-sheet">
      <header class="panel-chrome">
        <span class="progress-label" id="panel-title">Panel</span>
        <button type="button" class="panel-close" data-act="close-panel" aria-label="Zavřít"></button>
      </header>
      <div id="panel-body"></div>
      <footer class="panel-foot hidden" id="panel-foot"></footer>
    </div>
  </aside>

  <script src="js/rng.js"></script>
  <script src="js/data/enemies.js"></script>
  <script src="js/data/characters.js"></script>
  <script src="js/data/items.js"></script>
  <script src="js/data/map.js"></script>
  <script src="js/data/quests.js"></script>
  <script src="js/data/kauzy.js"></script>
  <script src="js/data/origins.js"></script>
  <script src="js/data/kodex.js"></script>
  <script src="js/data/names.js"></script>
  <script src="js/systems/combat.js"></script>
  <script src="js/systems/world.js"></script>
  <script src="js/systems/quests.js"></script>
  <script src="js/systems/kauza.js"></script>
  <script src="js/systems/origin.js"></script>
  <script src="js/systems/variants.js"></script>
  <script src="js/systems/stash.js"></script>
  <script src="js/systems/save.js"></script>
  <script src="js/systems/kodex.js"></script>
  <script src="js/systems/names.js"></script>
  <script src="js/ui/combat-text.js"></script>
  <script src="js/dev/scenarios.js"></script>
  <script src="app.js"></script>
</body>
</html>
